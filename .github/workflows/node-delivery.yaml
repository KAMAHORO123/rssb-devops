# Reusable delivery for RSSB Node.js apps (plan v3.2 §6.1, §6.3, D2-D4, D18).
#
#   develop -> build amd64+arm64 -> Trivy -> push GHCR -> Cosign -> digests to envs/uat
#   staging -> NO build: find the image built for this exact tree -> envs/staging
#   main    -> same lookup, in the "production" GitHub Environment: waits for a
#              required reviewer, then writes envs/prod (Argo CD prod sync stays manual)
#
# Images are tagged sha-<commit> and tree-<tree hash>. Merging develop into
# staging makes a new commit but the same tree, so the tested image is found.
# CI never talks to the cluster: it only commits digests to the GitOps repo.

name: node-delivery

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON list: [{"name","context","dockerfile","target","app"}]; app = folder under apps/ in the GitOps repo'
        type: string
        required: true
      gitops-repo:
        description: GitOps repository (owner/name)
        type: string
        required: true
    secrets:
      gitops-deploy-key:
        description: Deploy key with write access to the GitOps repo only
        required: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.meta.outputs.env }}
      prefix: ${{ steps.meta.outputs.prefix }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Tree tag and target environment
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          case "$GITHUB_REF_NAME" in
            develop) env=uat ;;
            staging) env=staging ;;
            main)    env=prod ;;
            *) echo "::error::Unexpected branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          {
            echo "tag=tree-${tree:0:12}"
            echo "env=$env"
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        name: Do images for this exact content already exist?
        env:
          IMAGES: ${{ inputs.images }}
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          missing=0
          for name in $(echo "$IMAGES" | jq -r '.[].name'); do
            ref="$PREFIX/$name:$TAG"; [ "$name" = "." ] && ref="$PREFIX:$TAG"
            if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then echo "found   $ref"; else echo "missing $ref"; missing=1; fi
          done
          if [ "$missing" = 0 ]; then echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = develop ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No image for $TAG: code must reach $GITHUB_REF_NAME through develop (UAT) first."
            exit 1
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: build (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(inputs.images) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        env:
          NAME: ${{ matrix.image.name }}
          PREFIX: ${{ needs.prepare.outputs.prefix }}
        run: |
          if [ "$NAME" = "." ]; then echo "image=$PREFIX" >> "$GITHUB_OUTPUT"; else echo "image=$PREFIX/$NAME" >> "$GITHUB_OUTPUT"; fi
          echo "key=$(echo "$NAME" | tr -c 'a-z0-9-\n' '_')" >> "$GITHUB_OUTPUT"
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: scan/image:ci
          cache-from: type=gha,scope=${{ steps.ref.outputs.key }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.ref.outputs.key }}-${{ matrix.platform.arch }}
      - name: Trivy image (fixable HIGH/CRITICAL block the publish)
        run: |
          touch .trivyignore
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
            --ignorefile /.trivyignore --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 scan/image:ci
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.ref.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.ref.outputs.key }}-${{ matrix.platform.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "_" separators: an image name must not prefix-match another (backend vs backend-migrator)
          name: digests_${{ steps.ref.outputs.key }}_${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [prepare, build]
    name: publish (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless Cosign signing
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - id: ref
        env:
          NAME: ${{ matrix.image.name }}
          PREFIX: ${{ needs.prepare.outputs.prefix }}
        run: |
          if [ "$NAME" = "." ]; then echo "image=$PREFIX" >> "$GITHUB_OUTPUT"; else echo "image=$PREFIX/$NAME" >> "$GITHUB_OUTPUT"; fi
          echo "key=$(echo "$NAME" | tr -c 'a-z0-9-\n' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests_${{ steps.ref.outputs.key }}_*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Multi-arch tags (tree- and sha-) and keyless signature
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:sha-${GITHUB_SHA:0:7}" \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"
          echo "Published and signed $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

  # One job per environment kind so that production can sit behind an
  # Environment with required reviewers (D18).
  deploy:
    needs: [prepare, publish]
    # Only an image that exists: reused (build == false) or freshly published.
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.env != 'prod' &&
      (needs.prepare.outputs.build == 'false' || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops-repo }}
          ssh-key: ${{ secrets.gitops-deploy-key }}
          path: gitops
      - &set-digests
        name: Write image digests into the environment folder
        env:
          IMAGES: ${{ inputs.images }}
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ENV_NAME: ${{ needs.prepare.outputs.env }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -euo pipefail
          cd gitops
          echo "$IMAGES" | jq -c '.[]' | while read -r img; do
            name=$(echo "$img" | jq -r .name); app=$(echo "$img" | jq -r .app)
            image="$PREFIX/$name"; [ "$name" = "." ] && image="$PREFIX"
            digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
            # Helm values file (or a Kustomize overlay): same "images:" list either way.
            file="apps/$app/envs/$ENV_NAME/values.yaml"
            [ -f "$file" ] || file="apps/$app/envs/$ENV_NAME/kustomization.yaml"
            # Replace the digest (or placeholder tag) on the line after "- name: <image>".
            python3 - "$file" "$image" "$digest" <<'PY'
          import re, sys
          path, image, digest = sys.argv[1:]
          text = open(path).read()
          pattern = re.compile(r"(  - name: " + re.escape(image) + r"\n)    (?:digest|newTag): \S+")
          new, n = pattern.subn(lambda m: m.group(1) + "    digest: " + digest, text)
          if n != 1:
              sys.exit(f"{image} not found exactly once in {path}")
          open(path, "w").write(new)
          PY
            echo "$app/$ENV_NAME: $image@$digest"
          done
          git diff --stat
          if git diff --quiet; then echo "Already deployed."; exit 0; fi
          git config user.name "rssb-ci-bot"
          git config user.email "rssb-ci-bot@users.noreply.github.com"
          git commit -qam "Deploy $TAG to $ENV_NAME" -m "Source: $SOURCE"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            sleep $((attempt * 3)); git pull --rebase -q origin main
          done
          echo "### $ENV_NAME now runs \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.env == 'prod'
    runs-on: ubuntu-24.04
    environment: production      # required reviewers approve before this runs (D18)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops-repo }}
          ssh-key: ${{ secrets.gitops-deploy-key }}
          path: gitops
      - *set-digests
